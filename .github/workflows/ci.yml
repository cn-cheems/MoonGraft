name: Verify
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: ilammy/msvc-dev-cmd@v1
        if: runner.os == 'Windows'
      - uses: hustcer/setup-moonbit@v1
        with:
          version: 0.10.17+d971670cd
          core-version: 0.10.17+d971670cd
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - run: moon update
      - run: moon run --deny-warn scripts/verify.mbtx
      - uses: actions/upload-artifact@v4
        with:
          name: template-case-${{ matrix.os }}
          path: _build/template-case.json
          if-no-files-found: error
